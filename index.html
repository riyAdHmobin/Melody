<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Preview</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #525659;
      min-height: 100%;
    }
    #viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 12px;
      box-sizing: border-box;
    }
    #viewer canvas {
      max-width: 100%;
      height: auto;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      background: #fff;
    }
    #status {
      color: #ddd;
      font-family: system-ui, sans-serif;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="status">Loading preview…</div>
  <div id="viewer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

    const url = "./file-sample_150kB.pdf";
    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");

    async function renderPage(pdf, num) {
      const page = await pdf.getPage(num);
      const scale = Math.min((window.innerWidth - 24) / page.getViewport({ scale: 1 }).width, 2);
      const viewport = page.getViewport({ scale: scale * (window.devicePixelRatio || 1) });

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = viewport.width / (window.devicePixelRatio || 1) + "px";

      viewer.appendChild(canvas);
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    (async () => {
      try {
        const pdf = await pdfjsLib.getDocument(url).promise;
        status.style.display = "none";
        for (let i = 1; i <= pdf.numPages; i++) {
          await renderPage(pdf, i);
        }
      } catch (err) {
        status.textContent = "Could not load PDF: " + err.message;
      }
    })();
  </script>

</body>

</html>
